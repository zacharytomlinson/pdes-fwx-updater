name: Linux Deb Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Install toolchain
        run: |
          rustup toolchain install $RUSTUP_TOOLCHAIN --component clippy --component rustfmt
          rustup default $RUSTUP_TOOLCHAIN

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config fakeroot curl

      - name: Fetch Linux tools (bossac)
        run: |
          set -euo pipefail
          BOSSAC_VERSION="1.9.1"
          mkdir -p tools/linux
          candidates=(
            "https://github.com/shumatech/BOSSA/releases/download/${BOSSAC_VERSION}/bossa-${BOSSAC_VERSION}-x86_64-linux.tar.gz"
            "https://github.com/shumatech/BOSSA/releases/download/${BOSSAC_VERSION}/bossa-${BOSSAC_VERSION}-x86_64-linux.tar.bz2"
            "https://github.com/shumatech/BOSSA/releases/download/${BOSSAC_VERSION}/bossac-${BOSSAC_VERSION}-x86_64-linux.tar.gz"
            "https://github.com/shumatech/BOSSA/releases/download/${BOSSAC_VERSION}/bossac-${BOSSAC_VERSION}-x86_64-linux.tar.bz2"
            "https://github.com/shumatech/BOSSA/releases/download/${BOSSAC_VERSION}/bossac-${BOSSAC_VERSION}-linux64.tar.gz"
          )
          fetched=0
          for url in "${candidates[@]}"; do
            echo "Attempting bossac fetch from $url"
            if curl -fL "$url" -o /tmp/bossac-archive; then
              case "$url" in
                *.tar.gz) tar -xzf /tmp/bossac-archive -C /tmp || continue ;;
                *.tar.bz2) tar -xjf /tmp/bossac-archive -C /tmp || continue ;;
                *) continue ;;
              esac
              # try common extracted paths
              if [ -x /tmp/bossa-${BOSSAC_VERSION}/bossac ]; then
                cp /tmp/bossa-${BOSSAC_VERSION}/bossac tools/linux/bossac
              elif [ -x /tmp/bossac-${BOSSAC_VERSION}/bossac ]; then
                cp /tmp/bossac-${BOSSAC_VERSION}/bossac tools/linux/bossac
              elif [ -x /tmp/bossac ]; then
                cp /tmp/bossac tools/linux/bossac
              else
                continue
              fi
              chmod +x tools/linux/bossac
              fetched=1
              break
            fi
          done
          if [ "$fetched" -ne 1 ]; then
            echo "Failed to fetch bossac ${BOSSAC_VERSION}" >&2
            exit 1
          fi

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Format check
        run: rustup run $RUSTUP_TOOLCHAIN cargo fmt --check

      - name: Lint
        run: rustup run $RUSTUP_TOOLCHAIN cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release binary
        run: rustup run $RUSTUP_TOOLCHAIN cargo build --release

      - name: Build Debian package
        run: rustup run $RUSTUP_TOOLCHAIN cargo deb --no-build

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdes-debian
          path: target/debian/*.deb
