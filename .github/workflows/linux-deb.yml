name: Linux Deb Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install $RUSTUP_TOOLCHAIN --component clippy rustfmt
          rustup default $RUSTUP_TOOLCHAIN

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config fakeroot curl

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Format check
        run: rustup run $RUSTUP_TOOLCHAIN cargo fmt --check

      - name: Lint
        run: rustup run $RUSTUP_TOOLCHAIN cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release binary
        run: rustup run $RUSTUP_TOOLCHAIN cargo build --release

      - name: Build Debian package
        run: rustup run $RUSTUP_TOOLCHAIN cargo deb --no-build

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdes-debian
          path: target/debian/*.deb
