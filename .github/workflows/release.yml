name: Release (Windows + Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
      BOSSAC_VERSION: "1.9.1"
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cargo.toml version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          python3 - <<'PY' "$expected"
          import re
          import sys
          from pathlib import Path
          
          expected = sys.argv[1].strip()
          if not re.match(r"^[0-9]+\.[0-9]+\.[0-9]+([\-+].+)?$", expected):
              raise SystemExit(f"Tag version '{expected}' is not a Cargo SemVer (expected e.g. 4.0.0)")
          
          path = Path("Cargo.toml")
          data = path.read_text(encoding="utf-8")
          m = re.search(r'(?ms)^(\[package\][\s\S]*?^version\s*=\s*")([^"]+)(")', data)
          if not m:
              raise SystemExit("Unable to find [package].version in Cargo.toml")
          
          actual = m.group(2).strip()
          if actual != expected:
              raise SystemExit(f"Cargo.toml version '{actual}' does not match tag '{expected}'")
          print(f"Cargo.toml version matches tag: {actual}")
          PY

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Install Rust toolchain
        run: |
          rustup toolchain install $RUSTUP_TOOLCHAIN --component clippy --component rustfmt
          rustup default $RUSTUP_TOOLCHAIN

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config fakeroot

      - name: Mint bootstrap pkg URL (optional)
        shell: bash
        env:
          PDES_WRITER_API_TOKEN: ${{ secrets.PDES_WRITER_API_TOKEN }}
          PDES_APP_SLUG: ${{ vars.PDES_APP_SLUG }}
        run: |
          set -euo pipefail
          if [[ -z "${PDES_WRITER_API_TOKEN:-}" ]]; then
            echo "PDES_WRITER_API_TOKEN not set; skipping bootstrap mint."
            exit 0
          fi
          slug="${PDES_APP_SLUG:-pdes-fwx-updater}"
          target="linux:x86_64"

          resp="$(mktemp)"
          curl -fsSL \
            -H "Authorization: Bearer ${PDES_WRITER_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"app_slug\":\"${slug}\",\"target\":\"${target}\"}" \
            "https://apps.palodurosystems.io/api/bootstrap/mint" \
            -o "$resp"

          pkg_url="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1], "r", encoding="utf-8")); print(data.get("pkg_url") or data.get("bootstrap_pkg_url") or "")' "$resp")"
          rm -f "$resp"

          if [[ -z "$pkg_url" ]]; then
            echo "Mint response missing pkg_url; skipping seed-config.json." >&2
            exit 0
          fi

          echo "::add-mask::$pkg_url"
          echo "PDES_PKG_URL=$pkg_url" >> "$GITHUB_ENV"

          python3 -c 'import json,sys; pkg_url=sys.argv[1]; open("packaging/linux/seed-config.json","w",encoding="utf-8").write(json.dumps({"bootstrap_pkg_url": pkg_url}, indent=2, sort_keys=True) + "\\n")' "$pkg_url"
          echo "Wrote packaging/linux/seed-config.json for bootstrap."

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Verify bundled Linux tools (bossac)
        run: |
          set -euo pipefail
          if [ ! -x tools/linux/bossac ]; then
            echo "ERROR: tools/linux/bossac is missing or not executable." >&2
            echo "Add the prebuilt bossac binary under tools/linux/bossac (commit it) so the .deb can be built offline." >&2
            exit 1
          fi

      - name: Format check
        run: rustup run $RUSTUP_TOOLCHAIN cargo fmt --check

      - name: Lint
        run: rustup run $RUSTUP_TOOLCHAIN cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release binary
        run: rustup run $RUSTUP_TOOLCHAIN cargo build --release

      - name: Build Debian package
        run: rustup run $RUSTUP_TOOLCHAIN cargo deb --no-build

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdes-linux-deb
          path: target/debian/*.deb

  build-windows:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-x86_64-pc-windows-gnu
      CARGO_TARGET: x86_64-pc-windows-gnu
      BOSSAC_VERSION: "1.9.1"
      ZADIG_VERSION: "2.9"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cargo.toml version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $ErrorActionPreference = "Stop"
          $expected = $env:GITHUB_REF_NAME
          if ($expected.StartsWith("v")) { $expected = $expected.Substring(1) }
          if ($expected -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([\-+].+)?$') {
            throw "Tag version '$expected' is not a Cargo SemVer (expected e.g. 4.0.0)"
          }
          $path = "Cargo.toml"
          $data = Get-Content $path -Raw
          $pattern = '(?ms)^(\[package\][\s\S]*?^version\s*=\s*")([^"]+)(")'
          $m = [regex]::Match($data, $pattern)
          if (-not $m.Success) { throw "Unable to find [package].version in Cargo.toml" }
          $actual = $m.Groups[2].Value.Trim()
          if ($actual -ne $expected) {
            throw "Cargo.toml version '$actual' does not match tag '$expected'"
          }
          Write-Host "Cargo.toml version matches tag: $actual"

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Install Rust nightly GNU toolchain
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --component clippy --component rustfmt
          rustup target add $env:CARGO_TARGET --toolchain $env:RUSTUP_TOOLCHAIN
          rustup default $env:RUSTUP_TOOLCHAIN

      - name: Install WiX Toolset 3.11
        run: |
          if (choco list --local-only wixtoolset | Select-String -Pattern 'wixtoolset') {
            Write-Host "WiX already installed; skipping reinstall."
          } else {
            choco install wixtoolset --version 3.11.2 -y --allow-downgrade
          }
          "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify bundled Windows tools (bossac + zadig)
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path tools/windows | Out-Null
          if (-not (Test-Path "tools/windows/bossac.exe")) {
            throw "bossac.exe missing from tools/windows; ensure it is committed to the repo."
          }
          if (-not (Test-Path ("tools/windows/zadig-{0}.exe" -f $env:ZADIG_VERSION))) {
            throw ("zadig-{0}.exe missing from tools/windows; ensure it is committed to the repo." -f $env:ZADIG_VERSION)
          }

      - name: Format check
        run: rustup run $env:RUSTUP_TOOLCHAIN cargo fmt --check

      - name: Lint
        run: rustup run $env:RUSTUP_TOOLCHAIN cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release binary (GNU)
        run: rustup run $env:RUSTUP_TOOLCHAIN cargo build --release --target $env:CARGO_TARGET

      - name: Mint bootstrap pkg URL (optional)
        env:
          PDES_WRITER_API_TOKEN: ${{ secrets.PDES_WRITER_API_TOKEN }}
          PDES_APP_SLUG: ${{ vars.PDES_APP_SLUG }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:PDES_WRITER_API_TOKEN) {
            Write-Host "PDES_WRITER_API_TOKEN not set; skipping bootstrap mint."
            exit 0
          }
          $slug = $env:PDES_APP_SLUG
          if (-not $slug) { $slug = "pdes-fwx-updater" }
          $target = "windows:x86_64"
          $body = @{ app_slug = $slug; target = $target } | ConvertTo-Json -Compress
          $resp = Invoke-RestMethod -Method Post `
            -Uri "https://apps.palodurosystems.io/api/bootstrap/mint" `
            -Headers @{ Authorization = "Bearer $($env:PDES_WRITER_API_TOKEN)" } `
            -ContentType "application/json" `
            -Body $body
          $pkgUrl = $resp.pkg_url
          if (-not $pkgUrl) { $pkgUrl = $resp.bootstrap_pkg_url }
          if (-not $pkgUrl) {
            Write-Host "Mint response missing pkg_url; skipping."
            exit 0
          }
          Write-Output "::add-mask::$pkgUrl"
          "PDES_PKG_URL=$pkgUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Minted bootstrap pkg URL for build_dist."

      - name: Package distribution folder
        run: rustup run $env:RUSTUP_TOOLCHAIN cargo run --bin build_dist --release --target $env:CARGO_TARGET
        env:
          # Used by src/bin/build_dist.rs to generate dist/PDES/seed-config.json for bootstrap installs.
          PDES_API_BASE_URL: ${{ vars.PDES_API_BASE_URL }}
          PDES_APP_SLUG: ${{ vars.PDES_APP_SLUG }}
          PDES_FIRMWARE_CHANNEL: ${{ vars.PDES_FIRMWARE_CHANNEL }}

      - name: Build MSI
        run: ./scripts/windows/build-msi.ps1 -PayloadDir "dist\PDES" -OutputMsi "dist\PDES.msi"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdes-windows-msi
          path: |
            dist/PDES.msi
            dist/PDES

  upload-cdn:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    env:
      PDES_CDN_UPLOAD_TOKEN: ${{ secrets.PDES_CDN_UPLOAD_TOKEN }}
      PDES_APP_SLUG: ${{ vars.PDES_APP_SLUG }}
    steps:
      - name: Check out sources (for icon + pkg builder)
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build CDN .pkg archives
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build_pkg.sh

          slug="${PDES_APP_SLUG:-}"
          if [[ -z "$slug" ]]; then
            slug="pdes-fwx-updater"
          fi

          version="${GITHUB_REF_NAME#v}"
          if [[ -z "$version" ]]; then
            echo "Unable to determine version from tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          icon="assets/icon.png"
          if [[ ! -f "$icon" ]]; then
            echo "Missing icon at $icon" >&2
            exit 1
          fi

          msi_path="$(find artifacts -type f -name '*.msi' | head -n 1 || true)"

          mapfile -t deb_candidates < <(find artifacts -type f -name '*.deb' | sort)
          deb_path=""
          for cand in "${deb_candidates[@]}"; do
            base="$(basename "$cand")"
            if [[ "$base" == *_arm64.deb || "$base" == *_aarch64.deb ]]; then
              deb_path="$cand"
              break
            fi
          done
          if [[ -z "$deb_path" && ${#deb_candidates[@]} -gt 0 ]]; then
            deb_path="${deb_candidates[0]}"
          fi
          if [[ -z "$msi_path" || -z "$deb_path" ]]; then
            echo "Expected both .msi and .deb artifacts under ./artifacts" >&2
            echo "Found MSI: ${msi_path:-<none>}" >&2
            echo "Found DEB: ${deb_path:-<none>}" >&2
            exit 1
          fi

          deb_arch="any"
          deb_arch_raw="$(dpkg-deb -f "$deb_path" Architecture 2>/dev/null || true)"
          deb_arch_raw="$(echo "${deb_arch_raw:-}" | tr -d '[:space:]')"
          if [[ -z "$deb_arch_raw" ]]; then
            deb_base="$(basename "$deb_path")"
            case "$deb_base" in
              *_amd64.deb) deb_arch_raw="amd64" ;;
              *_arm64.deb) deb_arch_raw="arm64" ;;
              *_aarch64.deb) deb_arch_raw="arm64" ;;
            esac
          fi
          case "$deb_arch_raw" in
            amd64) deb_arch="x86_64" ;;
            arm64) deb_arch="aarch64" ;;
          esac

          if [[ "$deb_arch" == "any" ]]; then
            echo "Unable to map Debian architecture '${deb_arch_raw:-<unknown>}' to an updater arch (expected amd64 or arm64)." >&2
            exit 1
          fi

          echo "Selected DEB: $deb_path (deb_arch_raw=${deb_arch_raw:-<unknown>} mapped_arch=${deb_arch})"

          mkdir -p artifacts/pdes-cdn-pkg

          scripts/build_pkg.sh \
            --slug "$slug" \
            --version "$version" \
            --os windows \
            --arch x86_64 \
            --installer "$msi_path" \
            --icon "$icon" \
            --display-name "PDES Firmware Updater" \
            --summary "Firmware updater installer" \
            --out "artifacts/pdes-cdn-pkg/${slug}-${version}-windows-x86_64.pkg"

          scripts/build_pkg.sh \
            --slug "$slug" \
            --version "$version" \
            --os linux \
            --arch "$deb_arch" \
            --installer "$deb_path" \
            --icon "$icon" \
            --display-name "PDES Firmware Updater" \
            --summary "Firmware updater installer" \
            --out "artifacts/pdes-cdn-pkg/${slug}-${version}-linux-${deb_arch}.pkg"

      - name: Upload .pkg files to CDN
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PDES_CDN_UPLOAD_TOKEN:-}" ]]; then
            echo "Missing secrets.PDES_CDN_UPLOAD_TOKEN" >&2
            exit 1
          fi

          slug="${PDES_APP_SLUG:-}"
          if [[ -z "$slug" ]]; then
            slug="pdes-fwx-updater"
          fi

          version="${GITHUB_REF_NAME#v}"
          if [[ -z "$version" ]]; then
            echo "Unable to determine version from tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          endpoint="https://apps.palodurosystems.io/api/apps/${slug}/package/upload"

          upload() {
            local os="$1"
            local arch="$2"
            local path="$3"

            local size
            size="$(wc -c <"$path" | tr -d ' ')"
            echo "Uploading: $path (${size} bytes) os=${os} arch=${arch} version=${version}"

            local headers_file body_file http_code curl_exit
            headers_file="$(mktemp)"
            body_file="$(mktemp)"

            set +e
            http_code="$(
              curl -sS --retry 3 --retry-all-errors \
                -o "$body_file" \
                -D "$headers_file" \
                -w "%{http_code}" \
                -H "Authorization: Bearer ${PDES_CDN_UPLOAD_TOKEN}" \
                -F "os=${os}" \
                -F "arch=${arch}" \
                -F "version=${version}" \
                -F "file=@${path};filename=$(basename "$path")" \
                "${endpoint}"
            )"
            curl_exit="$?"
            set -e

            if [[ "$curl_exit" -ne 0 ]]; then
              echo "Upload failed: curl exit code ${curl_exit}" >&2
              echo "--- response headers (if any) ---" >&2
              sed -n '1,120p' "$headers_file" >&2 || true
              echo "--- response body (if any) ---" >&2
              head -c 8192 "$body_file" >&2 || true
              echo >&2
              rm -f "$headers_file" "$body_file"
              exit 1
            fi

            if [[ "$http_code" -ge 200 && "$http_code" -lt 300 ]]; then
              cat "$body_file" || true
              rm -f "$headers_file" "$body_file"
              return 0
            fi

            echo "Upload failed: HTTP ${http_code}" >&2
            echo "--- response headers ---" >&2
            sed -n '1,120p' "$headers_file" >&2 || true
            echo "--- response body ---" >&2
            head -c 8192 "$body_file" >&2 || true
            echo >&2
            rm -f "$headers_file" "$body_file"
            exit 1
          }

          mapfile -t pkgs < <(find artifacts/pdes-cdn-pkg -type f -name '*.pkg' | sort)
          if (( ${#pkgs[@]} == 0 )); then
            echo "No .pkg artifacts found under ./artifacts/pdes-cdn-pkg" >&2
            exit 1
          fi

          for f in "${pkgs[@]}"; do
            base="$(basename "$f")"
            os=""
            arch=""
            case "$base" in
              *-windows-*.pkg) os="windows" ;;
              *-linux-*.pkg) os="linux" ;;
              *-macos-*.pkg) os="macos" ;;
              *)
                echo "Unable to determine os from filename: $base" >&2
                exit 1
                ;;
            esac
            arch="${base%.pkg}"
            arch="${arch##*-}"
            if [[ -z "$arch" ]]; then
              echo "Unable to determine arch from filename: $base" >&2
              exit 1
            fi
            upload "$os" "$arch" "$f"
          done

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, upload-cdn]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pdes-linux-deb/**/*.deb
            artifacts/pdes-windows-msi/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
