name: Release (Windows + Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
      BOSSAC_VERSION: "1.9.1"
    steps:
      - uses: actions/checkout@v4

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Install Rust toolchain
        run: |
          rustup toolchain install $RUSTUP_TOOLCHAIN --component clippy --component rustfmt
          rustup default $RUSTUP_TOOLCHAIN

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config fakeroot curl

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Fetch Linux tools (bossac)
        run: |
          echo "Skipping bossac fetch on Linux; postinst handles download if absent."

      - name: Format check
        run: rustup run $RUSTUP_TOOLCHAIN cargo fmt --check

      - name: Lint
        run: rustup run $RUSTUP_TOOLCHAIN cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release binary
        run: rustup run $RUSTUP_TOOLCHAIN cargo build --release

      - name: Build Debian package
        run: rustup run $RUSTUP_TOOLCHAIN cargo deb --no-build

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdes-linux-deb
          path: target/debian/*.deb

  build-windows:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-x86_64-pc-windows-gnu
      CARGO_TARGET: x86_64-pc-windows-gnu
      BOSSAC_VERSION: "1.9.1"
      ZADIG_VERSION: "2.9"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Install Rust nightly GNU toolchain
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --component clippy --component rustfmt
          rustup target add $env:CARGO_TARGET --toolchain $env:RUSTUP_TOOLCHAIN
          rustup default $env:RUSTUP_TOOLCHAIN

      - name: Install WiX Toolset 3.11
        run: |
          if (choco list --local-only wixtoolset | Select-String -Pattern 'wixtoolset') {
            Write-Host "WiX already installed; skipping reinstall."
          } else {
            choco install wixtoolset --version 3.11.2 -y --allow-downgrade
          }
          "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Fetch Windows tools (bossac + zadig)
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path tools/windows | Out-Null
          $downloads = @(
            "https://github.com/shumatech/BOSSA/releases/download/$($env:BOSSAC_VERSION)/bossac-$($env:BOSSAC_VERSION)-x64-windows.zip",
            "https://github.com/shumatech/BOSSA/releases/download/$($env:BOSSAC_VERSION)/bossa-$($env:BOSSAC_VERSION)-x64-windows.zip"
          )
          $downloaded = $false
          foreach ($url in $downloads) {
            $zip = "bossa.zip"
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -ErrorAction Stop
              Expand-Archive -Path $zip -DestinationPath tools/windows -Force
              Remove-Item $zip -ErrorAction SilentlyContinue
              $downloaded = $true
              break
            } catch {
              Write-Host "Failed to fetch $url, trying next..." -ForegroundColor Yellow
              Remove-Item $zip -ErrorAction SilentlyContinue
            }
          }
          if (-not $downloaded) {
            throw "Unable to download bossac zip for Windows"
          }
          $bossacExe = Get-ChildItem tools/windows -Recurse -Filter bossac.exe | Select-Object -First 1
          if ($null -eq $bossacExe) { throw "bossac.exe not found after download" }
          Copy-Item $bossacExe.FullName -Destination (Join-Path tools/windows "bossac.exe") -Force
          Invoke-WebRequest -Uri "https://github.com/pbatard/libwdi/releases/download/v1.5.3/zadig-$($env:ZADIG_VERSION).exe" -OutFile (Join-Path tools/windows "zadig-$($env:ZADIG_VERSION).exe")

      - name: Format check
        run: rustup run $env:RUSTUP_TOOLCHAIN cargo fmt --check

      - name: Lint
        run: rustup run $env:RUSTUP_TOOLCHAIN cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release binary (GNU)
        run: rustup run $env:RUSTUP_TOOLCHAIN cargo build --release --target $env:CARGO_TARGET

      - name: Package distribution folder
        run: rustup run $env:RUSTUP_TOOLCHAIN cargo run --bin build_dist --release

      - name: Build MSI
        run: ./scripts/windows/build-msi.ps1 -PayloadDir "dist\PDES" -OutputMsi "dist\PDES.msi"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdes-windows-msi
          path: |
            dist/PDES.msi
            dist/PDES

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pdes-linux-deb/**/*.deb
            artifacts/pdes-windows-msi/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
