name: Release (Windows + Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
      BOSSAC_VERSION: "1.9.1"
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cargo.toml version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          python3 - <<'PY' "$expected"
          import re
          import sys
          from pathlib import Path
          
          expected = sys.argv[1].strip()
          if not re.match(r"^[0-9]+\.[0-9]+\.[0-9]+([\-+].+)?$", expected):
              raise SystemExit(f"Tag version '{expected}' is not a Cargo SemVer (expected e.g. 4.0.0)")
          
          path = Path("Cargo.toml")
          data = path.read_text(encoding="utf-8")
          m = re.search(r'(?ms)^(\[package\][\s\S]*?^version\s*=\s*")([^"]+)(")', data)
          if not m:
              raise SystemExit("Unable to find [package].version in Cargo.toml")
          
          actual = m.group(2).strip()
          if actual != expected:
              raise SystemExit(f"Cargo.toml version '{actual}' does not match tag '{expected}'")
          print(f"Cargo.toml version matches tag: {actual}")
          PY

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Install Rust toolchain
        run: |
          rustup toolchain install $RUSTUP_TOOLCHAIN --component clippy --component rustfmt
          rustup default $RUSTUP_TOOLCHAIN

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config fakeroot

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Verify bundled Linux tools (bossac)
        run: |
          set -euo pipefail
          if [ ! -x tools/linux/bossac ]; then
            echo "ERROR: tools/linux/bossac is missing or not executable." >&2
            echo "Add the prebuilt bossac binary under tools/linux/bossac (commit it) so the .deb can be built offline." >&2
            exit 1
          fi

      - name: Format check
        run: rustup run $RUSTUP_TOOLCHAIN cargo fmt --check

      - name: Lint
        run: rustup run $RUSTUP_TOOLCHAIN cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release binary
        run: rustup run $RUSTUP_TOOLCHAIN cargo build --release

      - name: Build Debian package
        run: rustup run $RUSTUP_TOOLCHAIN cargo deb --no-build

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdes-linux-deb
          path: target/debian/*.deb

  build-windows:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-x86_64-pc-windows-gnu
      CARGO_TARGET: x86_64-pc-windows-gnu
      BOSSAC_VERSION: "1.9.1"
      ZADIG_VERSION: "2.9"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cargo.toml version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $ErrorActionPreference = "Stop"
          $expected = $env:GITHUB_REF_NAME
          if ($expected.StartsWith("v")) { $expected = $expected.Substring(1) }
          if ($expected -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([\-+].+)?$') {
            throw "Tag version '$expected' is not a Cargo SemVer (expected e.g. 4.0.0)"
          }
          $path = "Cargo.toml"
          $data = Get-Content $path -Raw
          $pattern = '(?ms)^(\[package\][\s\S]*?^version\s*=\s*")([^"]+)(")'
          $m = [regex]::Match($data, $pattern)
          if (-not $m.Success) { throw "Unable to find [package].version in Cargo.toml" }
          $actual = $m.Groups[2].Value.Trim()
          if ($actual -ne $expected) {
            throw "Cargo.toml version '$actual' does not match tag '$expected'"
          }
          Write-Host "Cargo.toml version matches tag: $actual"

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-

      - name: Install Rust nightly GNU toolchain
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --component clippy --component rustfmt
          rustup target add $env:CARGO_TARGET --toolchain $env:RUSTUP_TOOLCHAIN
          rustup default $env:RUSTUP_TOOLCHAIN

      - name: Install WiX Toolset 3.11
        run: |
          if (choco list --local-only wixtoolset | Select-String -Pattern 'wixtoolset') {
            Write-Host "WiX already installed; skipping reinstall."
          } else {
            choco install wixtoolset --version 3.11.2 -y --allow-downgrade
          }
          "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify bundled Windows tools (bossac + zadig)
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path tools/windows | Out-Null
          if (-not (Test-Path "tools/windows/bossac.exe")) {
            throw "bossac.exe missing from tools/windows; ensure it is committed to the repo."
          }
          if (-not (Test-Path ("tools/windows/zadig-{0}.exe" -f $env:ZADIG_VERSION))) {
            throw ("zadig-{0}.exe missing from tools/windows; ensure it is committed to the repo." -f $env:ZADIG_VERSION)
          }

      - name: Format check
        run: rustup run $env:RUSTUP_TOOLCHAIN cargo fmt --check

      - name: Lint
        run: rustup run $env:RUSTUP_TOOLCHAIN cargo clippy --all-targets --all-features -- -D warnings

      - name: Build release binary (GNU)
        run: rustup run $env:RUSTUP_TOOLCHAIN cargo build --release --target $env:CARGO_TARGET

      - name: Package distribution folder
        run: rustup run $env:RUSTUP_TOOLCHAIN cargo run --bin build_dist --release --target $env:CARGO_TARGET

      - name: Build MSI
        run: ./scripts/windows/build-msi.ps1 -PayloadDir "dist\PDES" -OutputMsi "dist\PDES.msi"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdes-windows-msi
          path: |
            dist/PDES.msi
            dist/PDES

  upload-cdn:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    env:
      PDES_CDN_UPLOAD_TOKEN: ${{ secrets.PDES_CDN_UPLOAD_TOKEN }}
      PDES_APP_SLUG: ${{ vars.PDES_APP_SLUG }}
    steps:
      - name: Check out sources (for icon)
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build CDN .pkg archives
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build_pkg.sh

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(python3 -c 'import re; from pathlib import Path; data=Path("Cargo.toml").read_text(encoding="utf-8"); m=re.search(r"(?ms)^\\[package\\][\\s\\S]*?^version\\s*=\\s*\\\"([^\\\"]+)\\\"", data); print(m.group(1) if m else "")')"
          fi
          if [[ -z "$version" ]]; then
            echo "Unable to determine version for .pkg build" >&2
            exit 1
          fi

          slug="${PDES_APP_SLUG:-}"
          if [[ -z "$slug" ]]; then
            slug="pdes-fwx-updater"
          fi

          icon="assets/icon.png"
          if [[ ! -f "$icon" ]]; then
            echo "Missing icon at $icon" >&2
            exit 1
          fi

          mkdir -p artifacts/pdes-cdn-pkg

          msi_path="$(find artifacts -type f -name '*.msi' | head -n 1 || true)"
          deb_path="$(find artifacts -type f -name '*.deb' | head -n 1 || true)"
          if [[ -z "$msi_path" || -z "$deb_path" ]]; then
            echo "Expected both .msi and .deb artifacts under ./artifacts" >&2
            echo "Found MSI: ${msi_path:-<none>}" >&2
            echo "Found DEB: ${deb_path:-<none>}" >&2
            exit 1
          fi

          deb_arch="any"
          deb_base="$(basename "$deb_path")"
          case "$deb_base" in
            *_amd64.deb) deb_arch="x86_64" ;;
            *_arm64.deb) deb_arch="aarch64" ;;
          esac

          scripts/build_pkg.sh \
            --slug "$slug" \
            --version "$version" \
            --os windows \
            --arch x86_64 \
            --installer "$msi_path" \
            --icon "$icon" \
            --display-name "PDES Firmware Updater" \
            --summary "Firmware updater installer" \
            --out "artifacts/pdes-cdn-pkg/${slug}-${version}-windows-x86_64.pkg"

          scripts/build_pkg.sh \
            --slug "$slug" \
            --version "$version" \
            --os linux \
            --arch "$deb_arch" \
            --installer "$deb_path" \
            --icon "$icon" \
            --display-name "PDES Firmware Updater" \
            --summary "Firmware updater installer" \
            --out "artifacts/pdes-cdn-pkg/${slug}-${version}-linux-${deb_arch}.pkg"

      - name: Upload installers + icon to CDN
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PDES_CDN_UPLOAD_TOKEN:-}" ]]; then
            echo "Missing secrets.PDES_CDN_UPLOAD_TOKEN" >&2
            exit 1
          fi

          endpoint="https://cdn.palodurosystems.io/api/upload"

          upload() {
            local path="$1"
            if [[ ! -f "$path" ]]; then
              echo "Missing file: $path" >&2
              exit 1
            fi
            echo "Uploading: $path"
            curl -fsS --retry 5 --retry-all-errors \
              -H "Authorization: Bearer ${PDES_CDN_UPLOAD_TOKEN}" \
              -F "file=@${path};filename=$(basename "$path")" \
              "${endpoint}"
            echo
          }

          mapfile -t installers < <(find artifacts -type f \( -name '*.msi' -o -name '*.deb' -o -name '*.pkg' \) | sort)
          if (( ${#installers[@]} == 0 )); then
            echo "No .msi/.deb/.pkg artifacts found under ./artifacts" >&2
            exit 1
          fi

          for f in "${installers[@]}"; do
            upload "$f"
          done

          upload "assets/icon.png"

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, upload-cdn]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pdes-linux-deb/**/*.deb
            artifacts/pdes-windows-msi/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
